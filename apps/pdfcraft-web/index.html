<!doctype html>
<html lang="am">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ብራና · Branna</title>
    <meta name="description" content="ብራና — በአማርኛ ነጻ የፒዲኤፍ መሣሪያ። Branna: a free PDF workbench with an Amharic interface." />
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <link data-trunk rel="icon" href="../../assets/branna/branna-mark.svg" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f1f3; }
      canvas { position: relative; z-index: 1; width: 100%; height: 100%; display: block; outline: none; }
      /* Branna: shown while the app downloads; the app paints over it when it starts (no script). */
      #branna-loading {
        position: fixed; inset: 0; z-index: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 6px; padding: 0 16px; text-align: center; color: #55555c;
        font: 15px/1.6 "Noto Sans Ethiopic", "Nyala", "Ebrima", "Kefa", system-ui, sans-serif;
      }
      #branna-loading strong { font-size: 30px; color: #a32a1e; }
      #branna-loading small { max-width: 30rem; color: #85858c; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #19191c; }
        #branna-loading { color: #b8b8bd; }
        #branna-loading strong { color: #e0705f; }
      }
    </style>
  </head>
  <body>
    <div id="branna-loading">
      <strong>ብራና</strong>
      <span>በመጫን ላይ… · Loading…</span>
      <small>የመጀመሪያው ጭነት ወደ 14 MB ያወርዳል፤ በዝግተኛ ኢንተርኔት ጥቂት ደቂቃዎች ሊወስድ ይችላል። The first visit downloads about 14 MB.</small>
    </div>
    <canvas id="pdfcraft"></canvas>
  </body>
</html>
