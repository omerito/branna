<script type="module">
import init, * as bindings from './pdfcraft-web-8f3647877c60c8bb.js';
const wasm = await init({ module_or_path: (async () => {
  // Branna: fetch the gzip copy and unpack it here (packaging/branna/precompress.py).
  if (typeof DecompressionStream === 'function') {
    try {
      const r = await fetch('./pdfcraft-web-8f3647877c60c8bb_bg.wasm.gz');
      if (r.ok) {
        const body = r.headers.get('content-encoding') ? r.body : r.body.pipeThrough(new DecompressionStream('gzip'));
        return new Response(body, { headers: { 'Content-Type': 'application/wasm' } });
      }
    } catch (e) {
      console.warn('Branna: the compressed download failed; using the full file', e);
    }
  }
  return fetch('./pdfcraft-web-8f3647877c60c8bb_bg.wasm');
})() });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
